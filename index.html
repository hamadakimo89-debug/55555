<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة باقات الموبايل - للجروب</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #4a5568;
      margin-bottom: 30px;
    }
    .network-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: #e2e8f0;
      transition: all 0.3s;
      font-weight: bold;
    }
    .tab.active {
      background: #3182ce;
      color: white;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #48bb78;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background: #38a169;
    }
    button.danger {
      background: #f56565;
    }
    button.danger:hover {
      background: #e53e3e;
    }
    .booking {
      background: #c6f6d5;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .stat-card {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .monthly-filter {
      margin: 20px 0;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: #f7fafc;
      font-weight: bold;
    }
    .poster-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px dashed #cbd5e0;
    }
    #posterCanvas {
      border: 2px dashed #4299e1;
      border-radius: 10px;
      max-width: 100%;
      height: 400px;
      background: white;
    }
    .total-budget {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #38a169;
      margin: 20px 0;
    }
    .auth-box {
      max-width: 420px;
      margin: auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 25px;
    }
    .hidden { display: none; }
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .small-btn {
      padding: 8px 12px;
      font-size: 14px;
      width: auto;
    }
    .item-row {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      background: #f9fafb;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .item-meta {
      margin-top: 8px;
      color: #4a5568;
      font-size: 14px;
    }
    .paid {
      color: #2f855a;
      font-weight: bold;
    }
    .unpaid {
      color: #c53030;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      form {
        grid-template-columns: 1fr;
      }
      .container { padding: 18px; }
      #posterCanvas { height: 260px; }
    }
  </style>
</head>
<body>
  <div id="auth-section" class="auth-box">
    <h2 style="text-align:center;">تسجيل الدخول / إنشاء حساب</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="pass" placeholder="كلمة السر">
    <button id="loginBtn" class="small-btn">دخول</button>
    <button id="registerBtn" class="small-btn">حساب جديد</button>
  </div>

  <div id="app-section" class="container hidden">
    <h1>🚀 إدارة باقات الموبايل للجروب</h1>
    <button id="logoutBtn" class="danger small-btn">خروج</button>

    <div class="network-tabs">
      <button class="tab active" data-network="all">الكل</button>
      <button class="tab" data-network="vodafone">فودافون</button>
      <button class="tab" data-network="orange">أورانج</button>
      <button class="tab" data-network="etisalat">اتصالات</button>
      <button class="tab" data-network="we">WE</button>
    </div>

    <form id="bookingForm">
      <input type="text" id="phone" placeholder="رقم الهاتف" required>
      <select id="network" required>
        <option value="">الشبكة</option>
        <option value="vodafone">فودافون</option>
        <option value="orange">أورانج</option>
        <option value="etisalat">اتصالات</option>
        <option value="we">WE</option>
      </select>
      <input type="number" id="amount" placeholder="المبلغ / الباقة" required>
      <input type="date" id="date">
      <button type="submit">تأكيد الحجز 💰</button>
      <button type="button" onclick="clearForm()">مسح</button>
    </form>

    <div class="total-budget" id="totalBudget">الميزانية الشهرية: 0 ج.م</div>

    <div class="stats">
      <div class="stat-card">إجمالي الحجوزات: <span id="totalBookings">0</span></div>
      <div class="stat-card">إجمالي المدفوعات: <span id="totalPaid">0</span> ج.م</div>
      <div class="stat-card">باقي الشهر: <span id="remaining">0</span> ج.م</div>
      <div class="stat-card">أعلى شبكة: <span id="topNetwork">-</span></div>
    </div>

    <div class="monthly-filter">
      <select id="monthFilter">
        <option value="all">كل الشهور</option>
      </select>
      <button onclick="exportCSV()" type="button">تصدير CSV 📊</button>
    </div>

    <table id="bookingsTable">
      <thead>
        <tr>
          <th>الرقم</th>
          <th>الشبكة</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
          <th>حالة الدفع</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="bookingsList"></tbody>
    </table>

    <div class="poster-section">
      <h3>📱 إنشاء بوستر دعاية</h3>
      <input type="text" id="posterText" placeholder="نص البوستر" value="باقات موبايل لكل الشبكات - تواصل معانا الآن!">
      <button type="button" onclick="generatePoster()">إنشاء بوستر</button>
      <canvas id="posterCanvas"></canvas>
      <br>
      <button type="button" onclick="sharePoster()" class="danger">مشاركة على واتساب 📲</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      where,
      deleteDoc,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_GL73xVPwn_nqxOLUOMGS_UVJJKmew8M",
      authDomain: "ragb-phone.firebaseapp.com",
      projectId: "ragb-phone",
      storageBucket: "ragb-phone.firebasestorage.app",
      messagingSenderId: "896182366021",
      appId: "1:896182366021:web:c4580b74677e558052d82c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let bookings = [];
    let monthlyBudget = 5000;
    let currentUserUid = null;
    let currentUnsub = null;
    let currentMonth = new Date().toISOString().slice(0, 7);

    window.clearForm = () => {
      document.getElementById('bookingForm').reset();
      document.getElementById('date').value = '';
    };

    window.exportCSV = () => {
      const csv = 'الرقم,الشبكة,المبلغ,التاريخ,مدفوع\n' +
        bookings.map(b => `${b.phone},${b.network},${b.amount},${b.date},${b.paid}`).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bookings_${currentMonth}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.generatePoster = () => {
      const canvas = document.getElementById('posterCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 900;
      canvas.height = 400;

      const gradient = ctx.createLinearGradient(0, 0, 900, 400);
      gradient.addColorStop(0, '#ff6b6b');
      gradient.addColorStop(1, '#4ecdc4');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 900, 400);

      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Arial';
      wrapText(ctx, document.getElementById('posterText').value, 450, 160, 760, 52);

      ctx.font = 'bold 28px Arial';
      ctx.fillText('📱 باقات لكل الشبكات', 450, 270);
      ctx.fillText('اتصل الآن!', 450, 320);
    };

    window.sharePoster = () => {
      const canvas = document.getElementById('posterCanvas');
      const url = canvas.toDataURL('image/png');
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent('بوستر دعاية جديد!')}`;
      window.open(whatsappUrl, '_blank');
      console.log(url);
    };

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((l, i) => ctx.fillText(l.trim(), x, startY + i * lineHeight));
    }

    function updateStats(filtered) {
      const totalBookings = filtered.length;
      const totalPaid = filtered.filter(b => b.paid).reduce((sum, b) => sum + b.amount, 0);
      const remaining = monthlyBudget - totalPaid;
      const networkCounts = {};
      filtered.forEach(b => networkCounts[b.network] = (networkCounts[b.network] || 0) + 1);
      const topNetwork = Object.entries(networkCounts).reduce(
        (a, b) => (a[1] > b[1] ? a : b),
        [null, 0]
      )[0] || '-';

      document.getElementById('totalBookings').textContent = totalBookings;
      document.getElementById('totalPaid').textContent = totalPaid;
      document.getElementById('remaining').textContent = remaining;
      document.getElementById('topNetwork').textContent = topNetwork;
      document.getElementById('totalBudget').textContent = `الميزانية الشهرية: ${monthlyBudget} ج.م`;
    }

    function updateMonthFilter() {
      const months = [...new Set(bookings.map(b => b.date.slice(0, 7)).filter(Boolean))];
      const select = document.getElementById('monthFilter');
      select.innerHTML = '<option value="all">كل الشهور</option>';
      months.forEach(m => {
        const option = document.createElement('option');
        option.value = m;
        option.textContent = new Date(m + '-01').toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
        select.appendChild(option);
      });
    }

    function displayBookings() {
      const activeTab = document.querySelector('.tab.active').dataset.network;
      const monthFilter = document.getElementById('monthFilter').value;
      let filtered = [...bookings];

      if (activeTab !== 'all') filtered = filtered.filter(b => b.network === activeTab);
      if (monthFilter !== 'all') filtered = filtered.filter(b => b.date.startsWith(monthFilter));

      const tbody = document.getElementById('bookingsList');
      tbody.innerHTML = '';

      filtered.forEach(b => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${b.phone}</td>
          <td>${b.network}</td>
          <td>${b.amount} ج.م</td>
          <td>${b.date}</td>
          <td class="${b.paid ? 'paid' : 'unpaid'}">${b.paid ? 'مدفوع' : 'غير مدفوع'}</td>
          <td>
            <div class="row-actions">
              <button class="small-btn" onclick="markPaid('${b.id}')"" ${b.paid ? 'disabled' : ''}>دفع</button>
              <button class="danger small-btn" onclick="deleteBooking('${b.id}')">حذف</button>
            </div>
          </td>
        `;
      });

      updateStats(filtered);
      updateMonthFilter();
    }

    async function loadBookings(uid) {
      if (currentUnsub) currentUnsub();

      const q = query(collection(db, "bookings"), where("uid", "==", uid));
      currentUnsub = onSnapshot(q, (snapshot) => {
        bookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        displayBookings();
      });
    }

    window.markPaid = async (id) => {
      await updateDoc(doc(db, "bookings", id), { paid: true });
    };

    window.deleteBooking = async (id) => {
      await deleteDoc(doc(db, "bookings", id));
    };

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const network = document.getElementById('network').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const date = document.getElementById('date').value || new Date().toISOString().slice(0, 10);

      if (!phone || !network || !amount) return;

      await addDoc(collection(db, "bookings"), {
        uid: currentUserUid,
        phone,
        network,
        amount,
        date,
        paid: false,
        createdAt: Date.now()
      });

      clearForm();
      generatePoster();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelector('.tab.active').classList.remove('active');
        e.target.classList.add('active');
        displayBookings();
      });
    });

    document.getElementById('monthFilter').addEventListener('change', displayBookings);

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      await createUserWithEmailAndPassword(auth, email, pass);
    });

    onAuthStateChanged(auth, (user) => {
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app-section');

      if (user) {
        currentUserUid = user.uid;
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        loadBookings(user.uid);
      } else {
        currentUserUid = null;
        if (currentUnsub) currentUnsub();
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    generatePoster();
  </script>
</body>
</html>
