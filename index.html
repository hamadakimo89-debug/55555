<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة باقات الموبايل - سحابي احترافي</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #3182ce; color: white; cursor: pointer; }
        .item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px; }
    </style>
</head>
<body>

    <!-- جزء الدخول -->
    <div id="auth-section" class="container">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد">
        <input type="password" id="pass" placeholder="كلمة السر">
        <button onclick="login()">دخول</button>
        <button onclick="register()">حساب جديد</button>
    </div>

    <!-- واجهة البرنامج الغنية -->
    <div id="app-section" class="container hidden">
        <h1>🚀 إدارة باقات الموبايل</h1>
        <button onclick="logout()">خروج</button>
        <hr>
        <input type="text" id="ownerName" placeholder="اسم العميل">
        <input type="text" id="phone" placeholder="رقم الموبايل">
        <select id="network"><option>فودافون</option><option>أورانج</option></select>
        <button onclick="saveData()">إضافة حجز</button>
        <div id="list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_GL73xVPwn_nqxOLUOMGS_UVJJKmew8M",
            authDomain: "ragb-phone.firebaseapp.com",
            projectId: "ragb-phone",
            storageBucket: "ragb-phone.firebasestorage.app",
            messagingSenderId: "896182366021",
            appId: "1:896182366021:web:c4580b74677e558052d82c"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (u) => {
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                loadData(u.uid);
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
        window.register = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
        window.logout = () => signOut(auth);

        window.saveData = async () => {
            await addDoc(collection(db, "bookings"), {
                name: document.getElementById('ownerName').value,
                phone: document.getElementById('phone').value,
                network: document.getElementById('network').value,
                uid: auth.currentUser.uid
            });
        };

        window.deleteItem = async (id) => await deleteDoc(doc(db, "bookings", id));

        function loadData(uid) {
            onSnapshot(query(collection(db, "bookings"), where("uid", "==", uid)), (snap) => {
                let html = '<h3>قائمة الحجوزات:</h3>';
                snap.forEach(d => {
                    html += `<div class="item">
                        <span>${d.data().name} | ${d.data().phone} | ${d.data().network}</span>
                        <span onclick="deleteItem('${d.id}')" style="color:red; cursor:pointer">× حذف</span>
                    </div>`;
                });
                document.getElementById('list').innerHTML = html;
            });
        }
    </script>
</body>
</html>
